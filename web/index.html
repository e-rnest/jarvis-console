<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">Home services</p>
        <h1>Jarvis</h1>
        <p id="refresh-state" class="refresh-state" aria-live="polite">Waiting for status</p>
      </div>
      <button id="refresh" class="refresh-button" type="button">Refresh</button>
    </header>
    <section id="services" class="service-grid" aria-label="Service status"></section>
    <dialog id="ipps-log" class="ipps-dialog" aria-labelledby="ipps-log-title">
      <div class="ipps-log-header">
        <h2 id="ipps-log-title">IPPS Telegram History</h2>
        <button id="ipps-close" type="button" class="refresh-button">Close</button>
      </div>
      <p id="ipps-log-state" role="status"></p>
      <div class="ipps-table-scroll">
        <table class="ipps-table">
          <thead><tr><th>Sender</th><th>Message</th><th>IP</th><th>Location</th></tr></thead>
          <tbody id="ipps-log-rows"></tbody>
        </table>
      </div>
    </dialog>
    <noscript>JavaScript is required to load current service status.</noscript>
    <footer class="site-footer">
      <a href="/services">Complete service, IP, and alias catalog</a>
    </footer>
  </main>
</body>
</html>
